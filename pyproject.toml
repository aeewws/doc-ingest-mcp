[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aeewws-doc-ingest-mcp"
version = "0.1.0"
description = "CLI and MCP server for document ingestion with Docling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "aeewws" }]
dependencies = [
  "pydantic>=2.11.0",
  "pypdf>=5.4.0",
  "python-docx>=1.1.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
docling = ["docling>=2.83.0"]
mcp = ["mcp>=1.10.0"]
dev = ["pytest>=8.3.5", "Pillow>=11.2.0", "reportlab>=4.4.0"]

[project.scripts]
doc-ingest = "doc_ingest_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_ingest_mcp"]
